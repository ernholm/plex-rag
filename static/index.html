<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex RAG Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .results-header {
            color: white;
            margin-bottom: 20px;
        }

        .results-header h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .result-poster {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            overflow: hidden;
        }

        .result-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-content {
            padding: 15px;
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            line-height: 1.3;
        }

        .result-type {
            display: inline-block;
            font-size: 0.8rem;
            background: #f0f0f0;
            color: #666;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .result-relevance {
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-description {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .no-results {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #666;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            color: white;
            font-size: 1.1rem;
        }

        .loading span {
            animation: pulse 1.5s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📺 Plex RAG Search</h1>
            <p>Ask natural questions about your Plex library</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    id="queryInput"
                    placeholder="e.g., 'movies with supernatural monsters' or 'comedies from the 80s'"
                    autocomplete="off"
                >
                <button onclick="performSearch()">Search</button>
                <button onclick="rebuildIndex()" style="background: #764ba2;">⟳ Rebuild</button>
            </div>
            <div class="status" id="status">Ready to search</div>
            <div class="error" id="error"></div>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2 id="resultsTitle">Results</h2>
            </div>
            <div class="results-grid" id="resultsGrid"></div>
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            No results found. Try a different search query!
        </div>
    </div>

    <script>
        const queryInput = document.getElementById('queryInput');
        const resultsSection = document.getElementById('resultsSection');
        const resultsGrid = document.getElementById('resultsGrid');
        const noResults = document.getElementById('noResults');
        const statusDiv = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        const resultsTitle = document.getElementById('resultsTitle');

        // Allow Enter key to search
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        async function performSearch() {
            const query = queryInput.value.trim();
            if (!query) {
                statusDiv.textContent = 'Please enter a search query';
                return;
            }

            statusDiv.innerHTML = '<div class="loading"><span>●</span><span>●</span><span>●</span></div>';
            errorDiv.classList.remove('active');
            resultsSection.classList.remove('active');
            noResults.style.display = 'none';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        limit: 12
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const results = await response.json();
                displayResults(results, query);

            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.classList.add('active');
                statusDiv.textContent = 'Search failed';
            }
        }

        function displayResults(results, query) {
            if (results.length === 0) {
                noResults.style.display = 'block';
                statusDiv.textContent = `No results found for "${query}"`;
                return;
            }

            resultsTitle.textContent = `Found ${results.length} result${results.length !== 1 ? 's' : ''} for "${query}"`;
            resultsGrid.innerHTML = '';

            results.forEach(result => {
                const card = createResultCard(result);
                resultsGrid.appendChild(card);
            });

            resultsSection.classList.add('active');
            statusDiv.textContent = `Showing ${results.length} result${results.length !== 1 ? 's' : ''}`;
        }

        function createResultCard(result) {
            const card = document.createElement('div');
            card.className = 'result-card';

            const relevancePercent = Math.round(result.relevance * 100);
            const typeLabel = result.type === 'tv_show' ? 'TV Show' : 'Movie';

            card.innerHTML = `
                <div class="result-poster">
                    ${result.poster_url ? `<img src="${result.poster_url}" alt="${result.title}">` : '🎬'}
                </div>
                <div class="result-content">
                    <div class="result-title">${escapeHtml(result.title)}</div>
                    <div class="result-type">${typeLabel}</div>
                    <div class="result-relevance">Match: ${relevancePercent}%</div>
                    <div class="result-description">${escapeHtml(result.description)}</div>
                </div>
            `;

            return card;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Rebuild index
        async function rebuildIndex() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⟳ Rebuilding...';
            statusDiv.innerHTML = '<div class="loading"><span>●</span><span>●</span><span>●</span></div>';
            errorDiv.classList.remove('active');

            try {
                const response = await fetch('/rebuild-index', { method: 'POST' });
                const data = await response.json();
                statusDiv.textContent = `✓ Index rebuilt: ${data.items_indexed} items indexed`;
                btn.textContent = '⟳ Rebuild';
                btn.disabled = false;
            } catch (error) {
                errorDiv.textContent = `Rebuild error: ${error.message}`;
                errorDiv.classList.add('active');
                statusDiv.textContent = 'Rebuild failed';
                btn.textContent = '⟳ Rebuild';
                btn.disabled = false;
            }
        }

        // Check API status on load
        async function checkStatus() {
            try {
                const response = await fetch('/index-status');
                const data = await response.json();
                if (data.total_items > 0) {
                    statusDiv.textContent = `Index ready: ${data.total_items} items indexed`;
                } else {
                    statusDiv.textContent = '⚠️ Index is empty. Click "Rebuild" to populate.';
                }
            } catch (error) {
                statusDiv.textContent = 'Unable to connect to API';
            }
        }

        checkStatus();
    </script>
</body>
</html>
