<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex RAG Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .results-header {
            color: white;
            margin-bottom: 20px;
        }

        .results-header h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .result-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            overflow: hidden;
        }

        .result-poster img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .result-content {
            padding: 15px;
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            line-height: 1.3;
        }

        .result-type {
            display: inline-block;
            font-size: 0.8rem;
            background: #f0f0f0;
            color: #666;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            margin-right: 4px;
        }

        .result-resolution {
            display: inline-block;
            font-size: 0.8rem;
            background: #fff3cd;
            color: #856404;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .result-rating {
            display: inline-block;
            font-size: 0.8rem;
            background: #fff8e1;
            color: #b8860b;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: 600;
            margin-left: 4px;
        }

        .result-relevance {
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-description {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .no-results {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideIn 0.3s;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: #333;
            flex: 1;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-poster {
            width: 100%;
            max-width: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-poster img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .modal-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .modal-badge {
            display: inline-block;
            background: #f0f0f0;
            color: #666;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .modal-relevance {
            color: #667eea;
            font-weight: 600;
        }

        .modal-description {
            color: #333;
            line-height: 1.6;
            font-size: 1rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

.modal-section-title {
            font-weight: 600;
            color: #333;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .modal-actors {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .actor-tag {
            background: #e8e8ff;
            color: #667eea;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .modal-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .detail-item {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
        }

        .detail-label {
            font-weight: 600;
            color: #666;
            margin-bottom: 4px;
        }

        .detail-value {
            color: #333;
        }

        .genre-tag {
            background: #f0e8ff;
            color: #764ba2;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            display: inline-block;
            margin-right: 6px;
            margin-top: 4px;
        }

        .resolution-badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-right: 10px;
        }

        .rating-badge {
            display: inline-block;
            background: #fff8e1;
            color: #b8860b;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-right: 10px;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            color: white;
            font-size: 1.1rem;
        }

        .loading span {
            animation: pulse 1.5s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📺 Plex RAG Search</h1>
            <p>Ask natural questions about your Plex library</p>
            <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 5px;">Version: <span id="versionDisplay">loading...</span></p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    id="queryInput"
                    placeholder="e.g., 'movies with supernatural monsters' or 'comedies from the 80s'"
                    autocomplete="off"
                >
                <select id="limitSelect" style="padding: 12px 8px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;" title="Maximum results to show">
                    <option value="12">12 Results</option>
                    <option value="25">25 Results</option>
                    <option value="50">50 Results</option>
                    <option value="100">100 Results</option>
                </select>
                <select id="thresholdSelect" style="padding: 12px 8px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;" title="Minimum match quality">
                    <option value="0.20">20% Quality</option>
                    <option value="0.30" selected>30% Quality</option>
                    <option value="0.40">40% Quality</option>
                    <option value="0.50">50% Quality</option>
                    <option value="0.60">60% Quality</option>
                </select>
                <button onclick="performSearch()">Search</button>
                <button onclick="rebuildIndex()" style="background: #764ba2;">⟳ Rebuild</button>
            </div>
            <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px; color: #333; font-size: 0.9rem;">
                <input type="checkbox" id="strictFilter" style="width: 18px; height: 18px; cursor: pointer;">
                <span>Strict Filtering (require mentioned actors/genres)</span>
            </label>
            <div class="status" id="status">Ready to search</div>
            <div class="error" id="error"></div>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2 id="resultsTitle">Results</h2>
            </div>
            <div class="results-grid" id="resultsGrid"></div>
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            No results found. Try a different search query!
        </div>

        <div class="modal" id="detailModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle"></h2>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                <div class="modal-poster" id="modalPoster"></div>
                <div class="modal-meta">
                    <span class="modal-badge" id="modalType"></span>
                    <span class="modal-badge modal-relevance" id="modalRelevance"></span>
                    <span id="modalResolution"></span>
                    <span id="modalRating"></span>
                </div>
                <div class="modal-details" id="modalDetails"></div>
                <div class="modal-description" id="modalDescription"></div>
                <div id="modalGenresSection"></div>
                <div id="modalActorsSection"></div>
            </div>
        </div>
    </div>

    <script>
        const queryInput = document.getElementById('queryInput');
        const resultsSection = document.getElementById('resultsSection');
        const resultsGrid = document.getElementById('resultsGrid');
        const noResults = document.getElementById('noResults');
        const statusDiv = document.getElementById('status');
        const errorDiv = document.getElementById('error');
        const resultsTitle = document.getElementById('resultsTitle');

        // Allow Enter key to search
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        async function performSearch() {
            const query = queryInput.value.trim();
            if (!query) {
                statusDiv.textContent = 'Please enter a search query';
                return;
            }

            const limit = parseInt(document.getElementById('limitSelect').value);
            const threshold = parseFloat(document.getElementById('thresholdSelect').value);
            const strictFilter = document.getElementById('strictFilter').checked;

            statusDiv.innerHTML = '<div class="loading"><span>●</span><span>●</span><span>●</span></div>';
            errorDiv.classList.remove('active');
            resultsSection.classList.remove('active');
            noResults.style.display = 'none';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        limit: limit,
                        min_relevance: threshold,
                        strict_filter: strictFilter
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const results = await response.json();
                displayResults(results, query);

            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.classList.add('active');
                statusDiv.textContent = 'Search failed';
            }
        }

        function displayResults(results, query) {
            if (results.length === 0) {
                noResults.style.display = 'block';
                statusDiv.textContent = `No results found for "${query}"`;
                return;
            }

            resultsTitle.textContent = `Found ${results.length} result${results.length !== 1 ? 's' : ''} for "${query}"`;
            resultsGrid.innerHTML = '';

            results.forEach(result => {
                const card = createResultCard(result);
                resultsGrid.appendChild(card);
            });

            resultsSection.classList.add('active');
            statusDiv.textContent = `Showing ${results.length} result${results.length !== 1 ? 's' : ''}`;
        }

        function createResultCard(result) {
            const card = document.createElement('div');
            card.className = 'result-card';

            const relevancePercent = Math.round(result.relevance * 100);
            const typeLabel = result.type === 'tv_show' ? 'TV Show' : 'Movie';

            card.innerHTML = `
                <div class="result-poster">
                    ${result.poster_url ? `<img src="${result.poster_url}" alt="${result.title}">` : '🎬'}
                </div>
                <div class="result-content">
                    <div class="result-title">${escapeHtml(result.title)}</div>
                    <div>
                        <span class="result-type">${typeLabel}</span>
                        ${result.resolution ? `<span class="result-resolution">${escapeHtml(result.resolution)}</span>` : ''}
                        ${result.rating ? `<span class="result-rating">★ ${result.rating.toFixed(1)}</span>` : ''}
                    </div>
                    <div class="result-relevance">Match: ${relevancePercent}%</div>
                    <div class="result-description">${escapeHtml(result.description)}</div>
                </div>
            `;

            card.onclick = () => showDetailModal(result);
            return card;
        }

        function showDetailModal(result) {
            const modal = document.getElementById('detailModal');
            const relevancePercent = Math.round(result.relevance * 100);
            const typeLabel = result.type === 'tv_show' ? 'TV Show' : 'Movie';

            document.getElementById('modalTitle').textContent = result.title;
            document.getElementById('modalType').textContent = typeLabel;
            document.getElementById('modalRelevance').textContent = `Match: ${relevancePercent}%`;

            const resolutionDiv = document.getElementById('modalResolution');
            if (result.resolution) {
                resolutionDiv.innerHTML = `<span class="resolution-badge">${escapeHtml(result.resolution)}</span>`;
            } else {
                resolutionDiv.innerHTML = '';
            }

            document.getElementById('modalDescription').textContent = result.description;

            // Display rating
            const ratingDiv = document.getElementById('modalRating');
            if (result.rating) {
                ratingDiv.innerHTML = `<span class="rating-badge">★ ${result.rating.toFixed(1)}</span>`;
            } else {
                ratingDiv.innerHTML = '';
            }

            // Display details (year, duration, director)
            const detailsDiv = document.getElementById('modalDetails');
            let detailsHTML = '';
            if (result.year) {
                detailsHTML += `<div class="detail-item"><div class="detail-label">Year</div><div class="detail-value">${result.year}</div></div>`;
            }
            if (result.duration) {
                const hours = Math.floor(result.duration / 60);
                const minutes = result.duration % 60;
                let durationStr = '';
                if (hours > 0) durationStr += `${hours}h `;
                if (minutes > 0) durationStr += `${minutes}m`;
                detailsHTML += `<div class="detail-item"><div class="detail-label">Duration</div><div class="detail-value">${durationStr}</div></div>`;
            }
            if (result.director) {
                detailsHTML += `<div class="detail-item"><div class="detail-label">Director</div><div class="detail-value">${escapeHtml(result.director)}</div></div>`;
            }
            detailsDiv.innerHTML = detailsHTML;

            // Display genres
            const genresSection = document.getElementById('modalGenresSection');
            if (result.genres && result.genres.length > 0) {
                const genreTags = result.genres
                    .map(genre => `<span class="genre-tag">${escapeHtml(genre)}</span>`)
                    .join('');
                genresSection.innerHTML = `
                    <div class="modal-section-title">Genres</div>
                    <div>${genreTags}</div>
                `;
            } else {
                genresSection.innerHTML = '';
            }

            // Display actors
            const actorsSection = document.getElementById('modalActorsSection');
            if (result.actors && result.actors.length > 0) {
                const actorTags = result.actors
                    .map(actor => `<span class="actor-tag">${escapeHtml(actor)}</span>`)
                    .join('');
                actorsSection.innerHTML = `
                    <div class="modal-section-title">Cast</div>
                    <div class="modal-actors">${actorTags}</div>
                `;
            } else {
                actorsSection.innerHTML = '';
            }

            const posterDiv = document.getElementById('modalPoster');
            if (result.poster_url) {
                posterDiv.innerHTML = `<img src="${result.poster_url}" alt="${result.title}">`;
            } else {
                posterDiv.textContent = '🎬';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target == modal) {
                modal.classList.remove('active');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Rebuild index
        async function rebuildIndex() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⟳ Rebuilding...';
            statusDiv.innerHTML = '<div class="loading"><span>●</span><span>●</span><span>●</span></div>';
            errorDiv.classList.remove('active');

            try {
                const response = await fetch('/rebuild-index', { method: 'POST' });
                const data = await response.json();
                statusDiv.textContent = `✓ Index rebuilt: ${data.items_indexed} chunks indexed`;
                btn.textContent = '⟳ Rebuild';
                btn.disabled = false;
                checkStatus(); // Refresh full status
            } catch (error) {
                errorDiv.textContent = `Rebuild error: ${error.message}`;
                errorDiv.classList.add('active');
                statusDiv.textContent = 'Rebuild failed';
                btn.textContent = '⟳ Rebuild';
                btn.disabled = false;
            }
        }

        // Check API status on load
        async function checkStatus() {
            try {
                const response = await fetch('/index-status');
                const data = await response.json();
                if (data.total_items > 0) {
                    statusDiv.textContent = `Index ready: ${data.total_items} items indexed`;
                } else {
                    statusDiv.textContent = '⚠️ Index is empty. Click "Rebuild" to populate.';
                }
            } catch (error) {
                statusDiv.textContent = 'Unable to connect to API';
            }
        }

        // Get version number
        async function loadVersion() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                document.getElementById('versionDisplay').textContent = data.version || 'unknown';
            } catch (error) {
                document.getElementById('versionDisplay').textContent = 'unknown';
            }
        }

        checkStatus();
        loadVersion();
    </script>
</body>
</html>
