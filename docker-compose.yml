version: '3.8'

services:
  plex-rag:
    build: .
    container_name: plex-rag-search
    ports:
      - "8000:8000"
    environment:
      - PLEX_URL=${PLEX_URL:-http://host.docker.internal:32400}
      - PLEX_TOKEN=${PLEX_TOKEN}
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    networks:
      - plex-network

volumes:
  chroma_data:
    driver: local

networks:
  plex-network:
    driver: bridge
